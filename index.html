<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<title>Rutina Ósea</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<style>
:root{
  --bg:#121212;
  --surface:#1c1c1e;
  --surface2:#252528;
  --border:#333336;
  --text:#f5f5f5;
  --text-dim:#a4a4a8;
  --accent:#f0a500;
  --accent-dim:#8a6000;
  --green:#4caf50;
  --red:#e5534b;
  --amber:#e5a44b;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:18px;
  line-height:1.4;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{margin:0 0 8px 0;}
h1{font-size:1.5rem;}
h2{font-size:1.3rem;}
h3{font-size:1.1rem;}
p{margin:0 0 8px 0;}
a{color:var(--accent);}
button{font-family:inherit;}
#app{padding:16px;max-width:640px;margin:0 auto;}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;max-width:640px;margin:0 auto;
}
.topbar h1{flex:1;font-size:1.25rem;}
.semana-badge{
  background:var(--surface2);color:var(--accent);
  padding:6px 12px;border-radius:20px;font-size:0.85rem;font-weight:600;
  white-space:nowrap;
}
.card{
  background:var(--surface);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--border);
}
.card-highlight{border-color:var(--accent);}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:44px;
  padding:10px 18px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--surface2);
  color:var(--text);
  font-size:1rem;
  font-weight:600;
  cursor:pointer;
  text-decoration:none;
}
.btn:active{opacity:0.7;}
.btn-primary{
  background:var(--accent);
  color:#1a1200;
  border-color:var(--accent);
}
.btn-large{
  width:100%;
  min-height:60px;
  font-size:1.2rem;
  border-radius:14px;
}
.btn-secondary{background:var(--surface2);}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red);}
.btn-block{width:100%;margin-bottom:10px;}
.btn-sm{min-height:38px;padding:6px 12px;font-size:0.9rem;}
.row{display:flex;gap:10px;flex-wrap:wrap;}
.row > *{flex:1;}
.text-dim{color:var(--text-dim);font-size:0.9rem;}
.tag{
  display:inline-block;
  background:var(--surface2);
  color:var(--accent);
  border:1px solid var(--accent-dim);
  font-size:0.72rem;
  padding:2px 8px;
  border-radius:20px;
  margin:2px 4px 2px 0;
}
.badge-descanso{color:#7fd1ff;}

/* bottom nav */
.nav-bottom{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:50;
}
.nav-item{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;
  padding:10px 0 8px;
  color:var(--text-dim);
  text-decoration:none;
  font-size:0.72rem;
  min-height:56px;
}
.nav-item.active{color:var(--accent);}
.nav-item .icon{font-size:1.4rem;line-height:1;}

/* progress bar */
.progress-outer{
  height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:12px 0 18px;
}
.progress-fill{
  height:100%;background:var(--accent);width:0%;transition:width .2s;
}

/* exercise card */
.ejercicio-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
}
.ejercicio-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.ejercicio-header h3{flex:1;}
.ejercicio-meta{color:var(--accent);font-weight:600;font-size:0.95rem;margin-bottom:4px;}
.ejercicio-notas{color:var(--text-dim);font-size:0.88rem;margin-bottom:10px;}
.ultima-vez{
  font-size:0.85rem;color:var(--text-dim);background:var(--surface2);
  border-radius:8px;padding:6px 10px;margin:2px 0 8px;
}
.ultima-vez.primera{font-style:italic;}
.ultima-vez-sube{
  display:flex;align-items:center;gap:6px;
  background:#3a2c13;border:1px solid var(--amber);color:var(--amber);
  font-size:0.85rem;font-weight:700;border-radius:8px;padding:6px 10px;margin:0 0 10px;
}
.dato-rapido{
  display:inline-block;font-size:0.72rem;font-weight:600;color:var(--accent);
  background:var(--surface2);border:1px solid var(--accent-dim);
  border-radius:20px;padding:2px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap;
}
.avisos-box{
  background:#3a2c13;border:1px solid var(--amber);border-radius:10px;
  padding:10px 12px;margin:2px 0 10px;
}
.aviso-item{
  display:flex;gap:8px;align-items:flex-start;color:var(--amber);
  font-size:0.85rem;font-weight:600;line-height:1.35;margin-bottom:6px;
}
.aviso-item:last-child{margin-bottom:0;}
.aviso-item .aviso-ico{flex-shrink:0;}
.serie-row{
  display:flex;align-items:center;gap:8px;
  padding:8px 0;
  border-top:1px solid var(--border);
  flex-wrap:wrap;
}
.serie-row:first-of-type{border-top:none;}
.serie-label{width:34px;color:var(--text-dim);font-size:0.85rem;flex-shrink:0;}
.peso-group,.reps-group{display:flex;align-items:center;gap:4px;}
.peso-group button,.reps-group button{
  width:38px;height:38px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);color:var(--text);font-size:1.2rem;
}
input[type=number]{
  background:var(--surface2);
  border:1px solid var(--border);
  color:var(--text);
  border-radius:8px;
  padding:8px 4px;
  font-size:1rem;
  text-align:center;
  width:64px;
  min-height:38px;
}
input[type=number].reps-input{width:52px;}
.field-unit{color:var(--text-dim);font-size:0.75rem;margin-left:2px;}
.indicador{width:18px;text-align:center;font-weight:700;flex-shrink:0;}
.ind-up{color:var(--green);}
.ind-down{color:var(--red);}
.ind-eq{color:var(--text-dim);}
input[type=checkbox]{
  width:28px;height:28px;flex-shrink:0;accent-color:var(--accent);
  margin-left:auto;
}
@media (max-width:400px){
  .serie-row{gap:5px;}
  .peso-group button,.reps-group button{width:32px;height:32px;font-size:1.05rem;}
  input[type=number]{width:52px;padding:8px 2px;}
  input[type=number].reps-input{width:42px;}
  input[type=checkbox]{width:26px;height:26px;}
}
.btn-video{
  background:var(--surface2);border:1px solid var(--border);color:var(--accent);
  border-radius:8px;padding:6px 10px;font-size:0.8rem;white-space:nowrap;
}
.btn-ficha{
  background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:6px 10px;font-size:0.82rem;margin:6px 0 2px;
  display:inline-flex;align-items:center;gap:4px;cursor:pointer;
}
.ficha-tecnica{background:var(--surface2);border-radius:10px;padding:12px;margin:8px 0 12px;font-size:0.88rem;}
.ficha-prioridad{display:inline-block;font-weight:700;font-size:0.76rem;padding:3px 10px;border-radius:20px;margin-bottom:8px;}
.ficha-prioridad.roja{background:#3a1613;color:var(--red);}
.ficha-prioridad.amarilla{background:#3a2c13;color:var(--amber);}
.ficha-prioridad.verde{background:#123a1a;color:var(--green);}
.ficha-tecnica h4{font-size:0.8rem;margin:10px 0 4px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.ficha-tecnica p{margin:0 0 4px;}
.ficha-tecnica ol,.ficha-tecnica ul{margin:0 0 4px 0;padding-left:20px;}
.ficha-tecnica li{margin-bottom:3px;}
.ficha-porque{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);color:var(--accent);font-size:0.85rem;}
.ficha-youtube{display:inline-block;margin-top:10px;color:var(--accent);font-weight:700;font-size:0.85rem;text-decoration:none;}

/* estiramientos */
.estiramiento-card{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  padding:14px;margin-bottom:14px;
}
.estiramiento-card.estatico{border-color:var(--accent-dim);background:#20180a;}
.estiramiento-meta{color:var(--text-dim);font-size:0.85rem;margin-bottom:6px;}
.estiramiento-nota{color:var(--text-dim);font-size:0.85rem;margin-bottom:10px;}
.estiramiento-evitar{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:0.82rem;color:var(--red);margin-bottom:10px;}
.estiramiento-item{padding:8px 0;border-top:1px solid var(--border);}
.estiramiento-item:first-of-type{border-top:none;}
.estiramiento-item .zona{color:var(--accent);font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.estiramiento-item .nombre{font-weight:600;margin:2px 0;}
.estiramiento-item .dosis{color:var(--text-dim);font-size:0.85rem;}
.estiramiento-check{
  display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;
  border-top:1px solid var(--border);font-size:0.95rem;font-weight:600;color:var(--text);
  cursor:pointer;
}
.estiramiento-check input[type=checkbox]{margin-left:0;}

/* impact block */
.impacto-box{border:1px solid var(--accent-dim);background:#20180a;border-radius:12px;padding:14px;margin-bottom:12px;}
.impacto-fase{color:var(--accent);font-weight:700;font-size:1.05rem;}
.impacto-regla{background:var(--surface2);border-radius:8px;padding:10px;font-size:0.85rem;color:var(--text-dim);margin:10px 0;}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;}
.modal.hidden{display:none;}
.modal-content{background:var(--surface);border-radius:var(--radius);padding:16px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-close{float:right;background:none;border:none;color:var(--text-dim);font-size:1.5rem;cursor:pointer;}
.video-frame{width:100%;aspect-ratio:16/9;border:none;border-radius:10px;}

/* toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:var(--accent);color:#1a1200;padding:10px 18px;border-radius:20px;
  font-weight:600;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.4);
}
.toast.hidden{display:none;}

/* tables */
table{width:100%;border-collapse:collapse;font-size:0.88rem;}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;}
tr.urgencia-alta td{color:var(--red);font-weight:700;}
tr.urgencia-media td:first-child{color:var(--amber);}

/* history list */
.hist-item{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;text-decoration:none;color:var(--text);
}
.hist-item .estado{font-size:0.78rem;color:var(--text-dim);}
.estado.completada{color:var(--green);}

select{
  background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:10px;font-size:1rem;width:100%;min-height:44px;
}
input[type=text],input[type=number].wide,input[type=date]{
  background:var(--surface2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:10px;font-size:1rem;width:100%;min-height:44px;
}
label{display:block;margin:10px 0 4px;font-size:0.9rem;color:var(--text-dim);}
.hidden{display:none !important;}
.back-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.btn-back{background:none;border:none;color:var(--text);font-size:1.6rem;padding:4px 8px;cursor:pointer;}
pre.resumen{
  white-space:pre-wrap;word-break:break-word;background:var(--surface2);
  border-radius:10px;padding:12px;font-size:0.82rem;color:var(--text);
  max-height:300px;overflow-y:auto;border:1px solid var(--border);
}
svg.grafica{width:100%;height:220px;background:var(--surface2);border-radius:10px;}
.opcion-suave{
  background:var(--surface2);border-radius:10px;padding:10px 12px;margin-bottom:8px;
  border:1px solid var(--border);
}
.opcion-suave .nombre{font-weight:700;}
.grupo-tag{
  display:inline-block;font-size:0.68rem;font-weight:700;color:var(--text-dim);
  border:1px solid var(--border);border-radius:20px;padding:1px 8px;margin-left:6px;vertical-align:middle;
  text-transform:uppercase;letter-spacing:.03em;
}
.grupo-tag.grupo-carga_osea{color:var(--accent);border-color:var(--accent);}
.grupo-tag.grupo-equilibrio{color:var(--accent-dim);border-color:var(--accent-dim);}
.sugerencia-semanal{margin:6px 0 12px;padding-left:20px;color:var(--text-dim);font-size:0.88rem;}
.sugerencia-semanal li{margin-bottom:4px;}
.opcion-postura{cursor:pointer;border-color:var(--accent-dim);}
.postura-abrir{float:right;color:var(--accent);font-size:0.8rem;font-weight:700;}
.postura-lista{margin:8px 0;}
.postura-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 0;border-top:1px solid var(--border);cursor:pointer;
}
.postura-item:first-of-type{border-top:none;}
.postura-item input[type=checkbox]{width:24px;height:24px;flex-shrink:0;margin-left:0;margin-top:2px;}
.postura-item-txt{display:flex;flex-direction:column;gap:2px;}
.postura-item-txt .nombre{font-weight:700;}
.postura-nota{font-size:0.82rem;}
.postura-habitos{margin-top:12px;background:var(--surface2);border-radius:8px;padding:10px 12px;}
.postura-habitos-tit{font-weight:700;font-size:0.82rem;margin-bottom:4px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.03em;}
.postura-habitos ul{margin:0;padding-left:20px;font-size:0.86rem;color:var(--text-dim);}
.regla-subida{
  background:var(--surface2);border:1px solid var(--accent);border-radius:10px;
  padding:12px 14px;margin:10px 0 14px;font-size:0.9rem;
}
.regla-subida-titulo{font-weight:700;color:var(--accent);margin-bottom:4px;}
.regla-subida p{margin:4px 0;}
.regla-subida-inc{font-weight:600;margin-top:6px;}
.regla-subida-nobajar{color:var(--text-dim);font-size:0.84rem;}
</style>
</head>

<div class="topbar">

<div id="app"></div>

</div>

<div id="modal-suave" class="modal hidden">

</div>

<nav class="nav-bottom">

const STORAGE_KEY = 'rutinaOseaData';
const DIAS = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const DIAS_ABR = {domingo:'dom',lunes:'lun',martes:'mar',miercoles:'mié',jueves:'jue',viernes:'vie',sabado:'sáb'};
const DIAS_LABEL = {domingo:'domingo',lunes:'lunes',martes:'martes',miercoles:'miércoles',jueves:'jueves',viernes:'viernes',sabado:'sábado'};
const EJERCICIOS_INFERIOR = new Set(['a_sentadilla','a_peso_muerto_rumano','a_zancadas','a_prensa','a_curl_femoral','a_gemelos','a_abductor','a_aductor','c_peso_muerto','c_hip_thrust']);
const SITIO_LABEL = {
  columna_lumbar:'columna lumbar', cadera:'cadera', cuello_femoral:'cuello femoral',
  muñeca:'muñeca', radio_distal:'radio distal', humero:'húmero', columna_toracica:'columna torácica', tibia:'tibia'
};
const GRUPO_LABEL = {
  carga_osea:'carga ósea', neutro:'neutro', equilibrio:'equilibrio',
  movilidad:'movilidad', tendon:'tendón', libre:'libre'
};
function grupoTagHtml(g){
  return g ? ' <span class="grupo-tag grupo-'+g+'">'+(GRUPO_LABEL[g]||g)+'</span>' : '';
}
function avisosBoxHtml(avisos){
  let h = '<div class="avisos-box">';
  avisos.forEach(a=>{ h += '<div class="aviso-item"><span class="aviso-ico">⚠️</span><span>'+a+'</span></div>'; });
  return h + '</div>';
}
function opcionMetaText(op){
  // Meta fija solo para opciones basadas en series (isométricos, movilidad).
  if(!op.series) return '';
  let t = op.series+' x ';
  if(op.duracionSeg) t += op.duracionSeg[0]+'-'+op.duracionSeg[1]+' seg';
  else if(op.reps!==undefined) t += op.reps+' reps';
  if(op.porHombro) t += ' /hombro';
  return t;
}
/* ---- Bloque de postura (cuello y espalda alta) ---- */
function getBloquePostura(){ return RUTINA.bloquePostura || null; }
function esOpcionPostura(op){ return !!op && (op.referencia==='bloquePostura' || op.grupo==='postura'); }
function posturaEjMetaText(ej){
  const parts = [];
  if(ej.series) parts.push(ej.series + (ej.reps ? (' x '+ej.reps) : ''));
  else if(ej.reps) parts.push(ej.reps+' reps');
  if(ej.duracionSeg!==undefined){
    parts.push((Array.isArray(ej.duracionSeg) ? ej.duracionSeg[0]+'-'+ej.duracionSeg[1] : ej.duracionSeg)+' seg');
  }
  if(ej.duracionMin!==undefined){
    parts.push((Array.isArray(ej.duracionMin) ? ej.duracionMin[0]+'-'+ej.duracionMin[1] : ej.duracionMin)+' min');
  }
  return parts.join(' · ');
}
function posturaChecklistHtml(){
  const bp = getBloquePostura();
  if(!bp) return '<p class="text-dim">No hay bloque de postura definido.</p>';
  let h = '';
  if(bp.motivo) h += '<p class="text-dim" style="margin-top:0;">'+bp.motivo+'</p>';

    bp.habitos.forEach(x=>{ h += '<li>'+x+'</li>'; });

  return h;
}
function reglaSubidaHtml(){

function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    const r=Math.random()*16|0, v = c==='x'?r:(r&0x3|0x8);
    return v.toString(16);
  });
}
function fmtNum(n){
  if(n===null||n===undefined||n==='') return '';
  return (Math.round(n*100)/100).toString().replace('.',',');
}
function defaultState(){
  return { fechaInicio: todayISO(), sesiones: [], diasSuaves: [], impacto: { sinMolestias: [] } };
}
function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      if(!parsed.impacto) parsed.impacto = { sinMolestias: [] };
      if(!parsed.diasSuaves) parsed.diasSuaves = [];
      if(!parsed.sesiones) parsed.sesiones = [];
      // Limpia sesiones vacías de días anteriores (abiertas y abandonadas, o
      // "terminadas" sin registrar nada). Se conservan las de hoy por si hay
      // una sesión en curso todavía sin datos.
      const hoy = todayISO();
      parsed.sesiones = parsed.sesiones.filter(function(s){
        return sesionTieneDatos(s) || s.fecha === hoy;
      });
      return parsed;
    }catch(e){ console.error('Estado corrupto, reiniciando', e); }
  }
  const s = defaultState();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  return s;
}
let state = loadState();
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ======================= HELPERS DE FECHAS / SEMANA ======================= */
function parseISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}
function diaSemanaKey(iso){ return DIAS[parseISO(iso).getDay()]; }
function addDays(iso, n){
  const d = parseISO(iso);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function getSemanaNumero(iso){
  const inicio = parseISO(state.fechaInicio);
  const d = parseISO(iso);
  const diffDays = Math.floor((d - inicio) / 86400000);
  return Math.floor(diffDays/7) + 1;
}
function getRangoSemana(numero){
  const inicioSemana = addDays(state.fechaInicio, (numero-1)*7);
  const finSemana = addDays(inicioSemana, 6);
  return { inicio: inicioSemana, fin: finSemana };
}
function fmtFechaCorta(iso){
  const d = parseISO(iso);
  return pad(d.getDate())+'/'+pad(d.getMonth()+1);
}

/* ======================= HELPERS DE RUTINA ======================= */
function getSesionDef(id){ return RUTINA.sesiones.find(s=>s.id===id); }
function getEjercicioDef(sesionDef, ejercicioId){ return sesionDef.ejercicios.find(e=>e.id===ejercicioId); }
function getIncremento(ejercicioId){ return EJERCICIOS_INFERIOR.has(ejercicioId) ? 5 : 2.5; }
function repsTargetText(ej){
  let t = '';
  if(ej.reps!==undefined) t = ''+ej.reps;
  else if(ej.repsMin!==undefined && ej.repsMax!==undefined) t = ej.repsMin+'-'+ej.repsMax;
  if(ej.porPierna) t += ' /pierna';
  if(ej.porLado) t += ' /lado';
  return t;
}
function getFaseImpacto(numeroSemana){
  const fases = RUTINA.protocoloImpacto.fases;
  for(const f of fases){
    if(numeroSemana >= f.semanaInicio && (f.semanaFin===null || numeroSemana <= f.semanaFin)) return f;
  }
  return fases[fases.length-1];
}
function faseRepsText(f){
  if(f.reps!==undefined) return ''+f.reps;
  if(f.repsMin!==undefined) return f.repsMin+'-'+f.repsMax;
  return '';
}

/* referencia: última vez que se hizo el ejercicio (excluyendo una sesión concreta) */
function getReferenciaPeso(ejercicioId, excludeSesionUuid){
  const historial = state.sesiones
    .filter(s => s.id !== excludeSesionUuid)
    .slice()
    .sort((a,b)=> b.fecha.localeCompare(a.fecha));
  for(const s of historial){
    const ej = s.ejercicios.find(e=>e.ejercicioId===ejercicioId);
    if(ej){
      const pesos = ej.series.filter(x=>x.hecha && x.peso!==null && x.peso!==undefined).map(x=>x.peso);
      if(pesos.length) return Math.max(...pesos);
    }
  }
  return null;
}

/* registro real (series hechas) de la última sesión en que se hizo el ejercicio */
function getUltimaVez(ejercicioId, excludeSesionUuid){
  const historial = state.sesiones
    .filter(s => s.id !== excludeSesionUuid)
    .slice()
    .sort((a,b)=> b.fecha.localeCompare(a.fecha));
  for(const s of historial){
    const entry = s.ejercicios.find(e=>e.ejercicioId===ejercicioId);
    if(entry){
      const hechas = entry.series.filter(x=>x.hecha);
      if(hechas.length) return { fecha: s.fecha, series: hechas };
    }
  }
  return null;
}

/* HTML del bloque "Última vez" bajo el nombre del ejercicio */
function ultimaVezHtml(ej, draft){
  const showPeso = ej.registraCarga;
  const showReps = (ej.reps!==undefined || ej.repsMin!==undefined) && !ej.duracionSeg;
  if(!showPeso && !showReps) return ''; // calentamiento / plancha por tiempo: sin peso ni reps

  const uv = getUltimaVez(ej.id, draft.id);
  if(!uv) return '<div class="ultima-vez primera">Primera vez</div>';

  const series = uv.series;
  const reps = series.map(s=> (s.reps!==null && s.reps!==undefined) ? s.reps : '—');
  let texto;
  if(showPeso){
    const pesos = series.map(s=>s.peso).filter(p=>p!==null && p!==undefined);
    const distintos = Array.from(new Set(pesos.map(fmtNum)));
    if(pesos.length && distintos.length===1){
      texto = 'Última vez: '+fmtNum(pesos[0])+' kg × '+reps.join(', ');
    } else if(pesos.length){
      // pesos distintos entre series: se muestra peso×reps por serie
      texto = 'Última vez: '+series.map(s=>{
        const p = (s.peso!==null && s.peso!==undefined) ? fmtNum(s.peso)+' kg' : '—';
        const r = (s.reps!==null && s.reps!==undefined) ? s.reps : '—';
        return p+'×'+r;
      }).join(', ');
    } else {
      texto = 'Última vez: '+reps.join(', ')+' reps';
    }
  } else {
    texto = 'Última vez: '+reps.join(', ')+' reps';
  }

  let html = '<div class="ultima-vez">'+texto+'</div>';
  if(ej.repsMax!==undefined){
    const maxRep = series.reduce((m,s)=> (s.reps!==null && s.reps!==undefined && s.reps>m) ? s.reps : m, 0);
    if(maxRep > ej.repsMax){
      html += '<div class="ultima-vez-sube">↑ Superaste el rango — sube peso</div>';
    }
  }
  return html;
}

function ytEmbed(url){
  try{
    const u = new URL(url);
    let id = '';
    if(u.hostname.indexOf('youtu.be')>=0) id = u.pathname.slice(1);
    else if(u.searchParams.get('v')) id = u.searchParams.get('v');
    else if(u.pathname.indexOf('/embed/')>=0) id = u.pathname.split('/embed/')[1];
    return id ? ('https://www.youtube.com/embed/'+id) : url;
  }catch(e){ return url; }
}

function getDraftActual(sesionId){
  // Sesión en curso de cierre: prioriza la que se está editando y, si no,
  // la más reciente de hoy para esa sesión (aunque ya esté marcada completada,
  // porque terminarSesion la completa antes de mostrar el estiramiento final).
  if(sesionActualDraft && sesionActualDraft.sesionId===sesionId) return sesionActualDraft;
  const hoy = todayISO();
  return state.sesiones.filter(s=> s.fecha===hoy && s.sesionId===sesionId)
    .sort((a,b)=> b.fecha.localeCompare(a.fecha))[0] || null;
}
/* Una sesión cuenta como realizada si está marcada completada o si tiene
   al menos una serie marcada como hecha (datos reales registrados). */
function sesionRealizada(s){
  return !!s && (s.completada === true || (s.ejercicios||[]).some(function(e){
    return (e.series||[]).some(function(x){ return x.hecha; });
  }));
}
/* Una sesión tiene datos reales si el usuario marcó alguna serie o anotó
   repeticiones. El peso se autocompleta con la referencia al abrir la sesión,
   así que NO cuenta como dato. Sirve para no mostrar sesiones vacías (abiertas
   y abandonadas, o "terminadas" sin registrar nada) en el historial. */
function sesionTieneDatos(s){
  return !!s && (s.ejercicios||[]).some(function(e){
    return (e.series||[]).some(function(x){
      return x.hecha === true || (x.reps!==null && x.reps!==undefined && x.reps!=='');
    });
  });
}
function toggleFicha(ejercicioId){
  const el = document.getElementById('ficha-'+ejercicioId);
  const arrow = document.getElementById('arrow-'+ejercicioId);
  if(!el) return;
  el.classList.toggle('hidden');
  if(arrow) arrow.textContent = el.classList.contains('hidden') ? '▾' : '▴';
}

      return '<li><strong>'+x.error+'</strong>'+(x.comoDetectarlo?' — '+x.comoDetectarlo:'')+'</li>';
    }).join('')+'</ul>';
  }
  if(ft.truco) h += '<h4>Truco</h4><p>'+ft.truco+'</p>';
  if(ft.nota) h += '<h4>Nota</h4><p>'+ft.nota+'</p>';

function guardarPostura(){

  const hoy = todayISO();
  const bloqueId = (bp && bp.ubicacion) || 'descanso_dinamico';
  const ex = state.diasSuaves.find(d=>d.fecha===hoy && d.tipo==='postura');
  if(ex){ ex.postura = marcados; ex.opcion = bp.nombre; }
  else { state.diasSuaves.push({ fecha:hoy, bloqueId, tipo:'postura', opcion:bp.nombre, postura:marcados }); }

  location.hash = '#/';
}

    textoLibre:     { label:'Actividad',        type:'text',   def:''   }

function camposDeOpcion(op){

  const base = (op.campos && op.campos.length) ? op.campos.slice() : [];

function guardarDiaSuave(bloqueId){
  const fecha = document.getElementById('suave-fecha').value || todayISO();
  const bloque = RUTINA.bloquesSuaves.find(b=>b.id===bloqueId) || RUTINA.bloquesSuaves[0];
  const opIdx = Number(document.getElementById('suave-opcion').value);
  const op = bloque.opciones[opIdx];

  // Postura: guarda una entrada con fecha SOLO si se marca al menos un ejercicio.
  if(esOpcionPostura(op)){
    const marcados = Array.prototype.slice.call(document.querySelectorAll('.postura-check'))
      .filter(c=>c.checked).map(c=>c.value);
    if(!marcados.length){ toast('Marca al menos un ejercicio de postura'); return; }
    const existente = state.diasSuaves.find(d=>d.fecha===fecha && d.bloqueId===bloqueId && d.tipo==='postura');
    if(existente){ existente.postura = marcados; existente.opcion = op.nombre; }
    else { state.diasSuaves.push({ fecha, bloqueId, tipo:'postura', opcion: op.nombre, postura: marcados }); }
    saveState();
    cerrarModalSuave();
    toast('Postura registrada');
    if(location.hash === '#/' || location.hash === '' ) renderInicio();
    return;
  }

  const datos = {};
  camposDeOpcion(op).forEach(c=>{
    const el = document.getElementById('suave-campo-'+c);
    if(!el) return;
    datos[c] = (el.type==='number') ? (Number(el.value)||null) : (el.value||null);
  });
  const duracion = (datos.duracionMin!==undefined) ? datos.duracionMin : null;

  const existente = state.diasSuaves.find(d=>d.fecha===fecha && d.bloqueId===bloqueId && d.tipo!=='postura');
  if(existente){
    existente.opcion = op.nombre;
    existente.duracion = duracion;
    existente.datos = datos;
  } else {
    state.diasSuaves.push({ fecha, bloqueId, opcion: op.nombre, duracion, datos });
  }
  saveState();
  cerrarModalSuave();
  toast('Día dinámico guardado');
  if(location.hash === '#/' || location.hash === '' ) renderInicio();
}

/* ======================= VISTA: SESION DE FUERZA ======================= */
let sesionActualDraft = null; // referencia al objeto de sesión en state.sesiones que se está editando

function findOrCreateDraft(sesionId){
  const hoy = todayISO();
  let draft = state.sesiones.find(s=> s.fecha===hoy && s.sesionId===sesionId && !s.completada);
  if(!draft){
    // Los estiramientos son ahora ejercicios de la sesión (tipo "estiramiento"),
    // así que ya no se guardan como campo aparte en el borrador.
    draft = { id: uuid(), fecha: hoy, sesionId: sesionId, completada: false, ejercicios: [] };
    state.sesiones.push(draft);
    saveState();
  }
  return draft;
}
function getEjercicioEntry(draft, ejercicioId, seriesCount){
  let entry = draft.ejercicios.find(e=>e.ejercicioId===ejercicioId);
  if(!entry){
    entry = { ejercicioId, series: [] };
    draft.ejercicios.push(entry);
  }
  while(entry.series.length < seriesCount){
    entry.series.push({ peso: null, reps: null, hecha: false });
  }
  return entry;
}

function renderSesion(sesionId){
  const sesionDef = getSesionDef(sesionId);
  if(!sesionDef){ location.hash = '#/'; return; }
  setActiveNav('inicio');
  document.getElementById('topbar-title').textContent = sesionDef.nombre;
  const draft = findOrCreateDraft(sesionId);
  sesionActualDraft = draft;
  const semanaNum = getSemanaNumero(draft.fecha);

  let totalUnidades = 0, hechasUnidades = 0;
  let html = '';
  html += '<div class="back-row"><button class="btn-back" onclick="location.hash=\'#/\'">←</button><h2 style="margin:0;">'+sesionDef.nombre+'</h2></div>';
  html += reglaSubidaHtml();
  html += '<div class="progress-outer"><div class="progress-fill" id="progress-fill"></div></div>';
  html += '<div id="ejercicios-wrap">';

  sesionDef.ejercicios.forEach(ej=>{
    if(ej.tipo === 'impacto'){
      html += renderBloqueImpacto(ej, draft, semanaNum);
      const fase = getFaseImpacto(semanaNum);
      totalUnidades += fase.series;
      const entry = getEjercicioEntry(draft, ej.id, fase.series);
      hechasUnidades += entry.series.filter(s=>s.hecha).length;
      return;
    }
    const seriesCount = ej.series || 1;
    const entry = getEjercicioEntry(draft, ej.id, seriesCount);
    totalUnidades += seriesCount;
    hechasUnidades += entry.series.filter(s=>s.hecha).length;
    html += renderEjercicioCard(ej, draft, entry);
  });

  html += '</div>';
  html += '<button class="btn btn-primary btn-large" style="margin-top:10px;" onclick="terminarSesion(\''+sesionId+'\')">Terminar sesión</button>';

  document.getElementById('app').innerHTML = html;
  saveState();
  actualizarProgreso();
}

function renderEjercicioCard(ej, draft, entry){
  const ref = getReferenciaPeso(ej.id, draft.id);
  const incremento = getIncremento(ej.id);
  let html = '<div class="ejercicio-card" data-ejercicio="'+ej.id+'">';
  html += '<div class="ejercicio-header"><h3>'+ej.nombre+(ej.alturaCajonCm?' <span class="dato-rapido">📦 Cajón '+ej.alturaCajonCm+' cm</span>':'')+'</h3>';
  if(ej.video){
    html += '<button class="btn-video" onclick="abrirModalVideo(\''+ej.video+'\')">▶ Vídeo</button>';
  }
  html += '</div>';

  if(ej.tipo === 'estiramiento'){
    if(ej.notas) html += '<div class="ejercicio-notas">'+ej.notas+'</div>';
    if(ej.avisos && ej.avisos.length) html += avisosBoxHtml(ej.avisos);
    const s0 = entry.series[0] || {};
    html += '<label class="estiramiento-check"><input type="checkbox" id="hecha-'+ej.id+'-0" '+(s0.hecha?'checked':'')+' onchange="onHechaChange(\''+ej.id+'\',0)"> Hecho</label>';
    html += '</div>';
    return html;
  }

  let metaParts = [];
  const seriesCount = ej.series || 1;
  if(ej.tipo!=='calentamiento'){
    let target = repsTargetText(ej);
    if(ej.distanciaM) target = ej.distanciaM[0]+'-'+ej.distanciaM[1]+' m';
    else if(ej.duracionSeg) target = ej.duracionSeg[0]+'-'+ej.duracionSeg[1]+' seg';
    metaParts.push(seriesCount+' x '+target);
  } else if(ej.duracionMin){
    metaParts.push(ej.duracionMin[0]+'-'+ej.duracionMin[1]+' min');
  }
  if(metaParts.length) html += '<div class="ejercicio-meta">'+metaParts.join(' · ')+'</div>';
  html += ultimaVezHtml(ej, draft);
  if(ej.notas) html += '<div class="ejercicio-notas">'+ej.notas+'</div>';
  if(ej.avisos && ej.avisos.length){
    html += '<div class="avisos-box">';
    ej.avisos.forEach(a=>{ html += '<div class="aviso-item"><span class="aviso-ico">⚠️</span><span>'+a+'</span></div>'; });
    html += '</div>';
  }
  if(ej.sitiosOseos){
    ej.sitiosOseos.forEach(s=>{
      html += '<span class="tag">'+(SITIO_LABEL[s]||s)+'</span>';
    });
  }
  if(ej.fichaTecnica){
    const vis = RUTINA.visualizacion && RUTINA.visualizacion.fichasTecnicas;
    const plegada = !vis || vis.plegadoPorDefecto !== false; // por defecto, plegada
    html += '<div><button type="button" class="btn-ficha" onclick="toggleFicha(\''+ej.id+'\')">Cómo se hace <span id="arrow-'+ej.id+'">'+(plegada?'▾':'▴')+'</span></button></div>';
    html += '<div class="ficha-tecnica'+(plegada?' hidden':'')+'" id="ficha-'+ej.id+'">'+fichaTecnicaHtml(ej.fichaTecnica)+'</div>';
  }

  html += '<div class="series-list">';
  for(let i=0;i<seriesCount;i++){
    const s = entry.series[i];
    const showPeso = ej.registraCarga;
    const showReps = (ej.reps!==undefined || ej.repsMin!==undefined) && !ej.duracionSeg;
    const pesoVal = (s.peso!==null && s.peso!==undefined) ? s.peso : (ref!==null && showPeso ? ref : '');
    if(s.peso===null && ref!==null && showPeso){ s.peso = ref; }

    html += '<div class="serie-row">';
    html += '<div class="serie-label">S'+(i+1)+'</div>';
    if(showPeso){
      html += '<div class="peso-group">';
      html += '<button type="button" onclick="ajustarPeso(\''+ej.id+'\','+i+',-'+incremento+')">−</button>';
      html += '<input type="number" step="0.5" class="peso-input" id="peso-'+ej.id+'-'+i+'" value="'+(pesoVal===''?'':fmtNum(pesoVal))+'" oninput="onPesoInput(\''+ej.id+'\','+i+')">';
      html += '<button type="button" onclick="ajustarPeso(\''+ej.id+'\','+i+',' +incremento+')">+</button>';
      html += '<span class="field-unit">kg</span>';
      html += '</div>';
      html += '<span class="indicador" id="ind-'+ej.id+'-'+i+'"></span>';
    }
    if(showReps){
      html += '<div class="reps-group">';
      html += '<button type="button" onclick="ajustarReps(\''+ej.id+'\','+i+',-1)">−</button>';
      html += '<input type="number" class="reps-input" id="reps-'+ej.id+'-'+i+'" placeholder="'+repsTargetText(ej).split(' ')[0]+'" value="'+(s.reps!==null&&s.reps!==undefined?s.reps:'')+'" oninput="onRepsInput(\''+ej.id+'\','+i+')">';
      html += '<button type="button" onclick="ajustarReps(\''+ej.id+'\','+i+',1)">+</button>';
      html += '</div>';
    }
    html += '<input type="checkbox" id="hecha-'+ej.id+'-'+i+'" '+(s.hecha?'checked':'')+' onchange="onHechaChange(\''+ej.id+'\','+i+')">';
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function confirmarSinMolestias(){
  const hoy = todayISO();
  if(!state.impacto.sinMolestias.some(x=>x.fecha===hoy)){
    state.impacto.sinMolestias.push({ fecha: hoy });
    saveState();
    toast('Registrado: sin molestias');
    renderSesion(sesionActualDraft.sesionId);
  }
}

function ajustarPeso(ejercicioId, idx, delta){
  const input = document.getElementById('peso-'+ejercicioId+'-'+idx);
  let val = parseFloat((input.value||'0').replace(',','.')) || 0;
  val = Math.max(0, Math.round((val+delta)*100)/100);
  input.value = fmtNum(val);
  onPesoInput(ejercicioId, idx);
}
function onPesoInput(ejercicioId, idx){
  const input = document.getElementById('peso-'+ejercicioId+'-'+idx);
  const val = input.value==='' ? null : parseFloat(input.value.replace(',','.'));
  const entry = sesionActualDraft.ejercicios.find(e=>e.ejercicioId===ejercicioId);
  entry.series[idx].peso = isNaN(val) ? null : val;
  const ref = getReferenciaPeso(ejercicioId, sesionActualDraft.id);
  const indEl = document.getElementById('ind-'+ejercicioId+'-'+idx);
  if(indEl){
    if(ref===null || val===null || isNaN(val)){ indEl.textContent=''; indEl.className='indicador'; }
    else if(val>ref){ indEl.textContent='▲'; indEl.className='indicador ind-up'; }
    else if(val<ref){ indEl.textContent='▼'; indEl.className='indicador ind-down'; }
    else { indEl.textContent='='; indEl.className='indicador ind-eq'; }
  }
  saveState();
}
function ajustarReps(ejercicioId, idx, delta){
  const input = document.getElementById('reps-'+ejercicioId+'-'+idx);
  let val = parseInt(input.value, 10);
  if(isNaN(val)) val = parseInt(input.placeholder, 10) || 0;
  else val = val + delta;
  val = Math.max(0, val);
  input.value = val;
  onRepsInput(ejercicioId, idx);
}
function onRepsInput(ejercicioId, idx){
  const input = document.getElementById('reps-'+ejercicioId+'-'+idx);
  const val = input.value==='' ? null : parseInt(input.value,10);
  const entry = sesionActualDraft.ejercicios.find(e=>e.ejercicioId===ejercicioId);
  entry.series[idx].reps = isNaN(val) ? null : val;
  saveState();
}
function onHechaChange(ejercicioId, idx){
  const checked = document.getElementById('hecha-'+ejercicioId+'-'+idx).checked;
  const entry = sesionActualDraft.ejercicios.find(e=>e.ejercicioId===ejercicioId);
  entry.series[idx].hecha = checked;
  saveState();
  actualizarProgreso();
}
function actualizarProgreso(){
  if(!sesionActualDraft) return;
  let total=0, hechas=0;
  sesionActualDraft.ejercicios.forEach(e=>{
    total += e.series.length;
    hechas += e.series.filter(s=>s.hecha).length;
  });
  const pct = total>0 ? Math.round(hechas/total*100) : 0;
  const fill = document.getElementById('progress-fill');
  if(fill) fill.style.width = pct+'%';
}
function terminarSesion(sesionId){
  // El estiramiento estático es ahora el último ejercicio de la sesión, así que
  // al terminar se marca la sesión como completada y se vuelve al inicio.
  const s = getDraftActual(sesionId);
  if(s){ s.completada = true; sesionActualDraft = s; }
  saveState();
  toast('Sesión guardada');
  location.hash = '#/';
}

/* trigger inicial de indicadores tras render */
function inicializarIndicadores(){
  document.querySelectorAll('.peso-input').forEach(inp=>{
    const parts = inp.id.split('-'); // peso-<ejercicioId>-<idx>  (ejercicioId puede tener guiones bajos, no guiones)

function renderGrafica(ejercicioId){
  const puntos = [];
  state.sesiones.filter(sesionRealizada).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(s=>{
    const ej = s.ejercicios.find(e=>e.ejercicioId===ejercicioId);
    if(ej){
      const pesos = ej.series.filter(x=>x.hecha && x.peso!==null && x.peso!==undefined).map(x=>x.peso);
      if(pesos.length) puntos.push({ fecha: s.fecha, peso: Math.max(...pesos) });
    }
  });
  const wrap = document.getElementById('grafica-wrap');
  if(puntos.length < 2){
    wrap.innerHTML = '<p class="text-dim">Necesitas al menos 2 sesiones registradas de este ejercicio para ver la gráfica.</p>';
    return;
  }
  const W=320,H=200,PAD=32;
  const pesos = puntos.map(p=>p.peso);
  const minP = Math.min(...pesos), maxP = Math.max(...pesos);
  const rangoP = (maxP-minP) || 1;
  const stepX = (W-PAD*2) / (puntos.length-1);
  const coords = puntos.map((p,i)=>{
    const x = PAD + i*stepX;
    const y = H-PAD - ((p.peso-minP)/rangoP) * (H-PAD*2);
    return {x,y,p};
  });
  let path = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  let svg = '<svg class="grafica" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">';
  svg += '<path d="'+path+'" fill="none" stroke="#f0a500" stroke-width="2.5"/>';
  coords.forEach(c=>{
    svg += '<circle cx="'+c.x.toFixed(1)+'" cy="'+c.y.toFixed(1)+'" r="4" fill="#f0a500"/>';
    svg += '<text x="'+c.x.toFixed(1)+'" y="'+(c.y-10).toFixed(1)+'" font-size="10" fill="#f5f5f5" text-anchor="middle">'+fmtNum(c.p.peso)+'</text>';
    svg += '<text x="'+c.x.toFixed(1)+'" y="'+(H-8)+'" font-size="9" fill="#a4a4a8" text-anchor="middle">'+fmtFechaCorta(c.p.fecha)+'</text>';
  });
  svg += '</svg>';
  wrap.innerHTML = svg;
}

function importarDatos(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.fechaInicio || !Array.isArray(parsed.sesiones)){
        alert('El archivo no tiene el formato esperado.');
        return;
      }
      if(confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')){
        state = parsed;
        if(!state.impacto) state.impacto = { sinMolestias: [] };
        if(!state.diasSuaves) state.diasSuaves = [];
        saveState();
        toast('Datos importados');
        renderAjustes();
      }
    }catch(err){
      alert('No se pudo leer el archivo: '+err.message);
    }
  };
  reader.readAsText(file);
}

function formatDelta(actual, anterior){
  if(anterior===null || anterior===undefined) return '';
  const diff = Math.round((actual-anterior)*100)/100;
  if(diff===0) return ' (=)';
  return ' ('+(diff>0?'+':'')+fmtNum(diff)+')';
}
function copiarParaClaude(){
  const semanaActual = getSemanaNumero(todayISO());
  const desde = Math.max(1, semanaActual-3);
  let bloques = [];

  for(let n=desde; n<=semanaActual; n++){
    const rango = getRangoSemana(n);
    let lineas = [];
    lineas.push('SEMANA '+n+' ('+rango.inicio+' a '+rango.fin+')');

    let fuerzaCompletadas = 0;
    ['A','B','C'].forEach(sid=>{
      const sesionesSemana = state.sesiones.filter(s=> s.sesionId===sid && s.fecha>=rango.inicio && s.fecha<=rango.fin);
      // Prioriza una sesión realizada; si no hay, la más reciente (p.ej. duplicados en curso).
      const porFecha = function(a,b){ return b.fecha.localeCompare(a.fecha); };
      const sesion = sesionesSemana.filter(sesionRealizada).sort(porFecha)[0]
                  || sesionesSemana.slice().sort(porFecha)[0];
      const def = getSesionDef(sid);
      if(sesion && sesionRealizada(sesion)){
        fuerzaCompletadas++;
        const d = parseISO(sesion.fecha);
        const partesEj = [];
        sesion.ejercicios.forEach(entry=>{
          const ejDef = def.ejercicios.find(e=>e.id===entry.ejercicioId);
          if(!ejDef || !ejDef.registraCarga) return;
          const pesosHechos = entry.series.filter(s=>s.hecha && s.peso!==null && s.peso!==undefined).map(s=>s.peso);
          if(!pesosHechos.length) return;
          const maxPeso = Math.max(...pesosHechos);
          const anterior = getReferenciaPesoAntesDe(ejDef.id, sesion.fecha, sesion.id);
          const seriesN = ejDef.series || entry.series.length;
          const target = ejDef.distanciaM ? (ejDef.distanciaM[0]+'-'+ejDef.distanciaM[1]+'m') : repsTargetText(ejDef);
          partesEj.push(ejDef.nombre+' '+seriesN+'x'+target+' @'+fmtNum(maxPeso)+'kg'+formatDelta(maxPeso, anterior));
        });
        lineas.push('Sesión '+sid+' ('+DIAS_ABR[diaSemanaKey(sesion.fecha)]+' '+d.getDate()+'): '+(partesEj.length?partesEj.join(' | '):'sin cargas registradas'));
      } else {
        lineas.push('Sesión '+sid+': [no realizada]');
      }
    });

    // impacto: de la sesion C de esa semana
    const sesionC = state.sesiones.filter(s=>s.sesionId==='C' && s.fecha>=rango.inicio && s.fecha<=rango.fin && sesionRealizada(s))
      .sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
    if(sesionC){
      const fase = getFaseImpacto(n);
      const sinMolestias = state.impacto.sinMolestias.some(x=> x.fecha>=rango.inicio && x.fecha<=rango.fin);
      lineas.push('Impacto: fase '+fase.fase+', '+(sinMolestias?'sin molestias':'sin confirmar'));
    }

    const suavesSemana = state.diasSuaves.filter(d=>d.fecha>=rango.inicio && d.fecha<=rango.fin).length;
    lineas.push('Adherencia: '+fuerzaCompletadas+'/3 fuerza, '+Math.min(suavesSemana,3)+'/3 suaves');

    bloques.push(lineas.join('\n'));
  }

  const texto = bloques.join('\n\n');
  const preview = document.getElementById('resumen-preview');
  preview.textContent = texto;
  preview.classList.remove('hidden');

  copiarAlPortapapeles(texto);
}
function getReferenciaPesoAntesDe(ejercicioId, fechaLimite, excludeSesionUuid){
  const historial = state.sesiones
    .filter(s => s.id !== excludeSesionUuid && s.fecha < fechaLimite)
    .slice().sort((a,b)=> b.fecha.localeCompare(a.fecha));
  for(const s of historial){
    const ej = s.ejercicios.find(e=>e.ejercicioId===ejercicioId);
    if(ej){
      const pesos = ej.series.filter(x=>x.hecha && x.peso!==null && x.peso!==undefined).map(x=>x.peso);
      if(pesos.length) return Math.max(...pesos);
    }
  }
  return null;
}
function copiarAlPortapapeles(texto){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(texto).then(()=> toast('Copiado al portapapeles')).catch(()=> copiarFallback(texto));
  } else {
    copiarFallback(texto);
  }
}
function copiarFallback(texto){
  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try{
    document.execCommand('copy');
    toast('Copiado al portapapeles');
  }catch(e){
    toast('No se pudo copiar automáticamente, cópialo manualmente');
  }
  document.body.removeChild(ta);
}

/* ======================= VISTA: REFERENCIA ======================= */
function renderReferencia(){
  setActiveNav('referencia');
  document.getElementById('topbar-title').textContent = 'Referencia';

  let html = '<h2>Evitar</h2>';
  RUTINA.evitar.forEach(e=>{
    html += '<div class="card">';
    html += '<h3>'+e.que+'</h3>';
    if(e.ejemplos && e.ejemplos.length) html += '<p class="text-dim">Ej: '+e.ejemplos.join(', ')+'</p>';
    html += '<p>'+e.motivo+'</p>';
    html += '</div>';
  });

  html += '<h2 style="margin-top:20px;">Alertas</h2>';
  html += '<table><thead><tr><th>Señal</th><th>Acción</th></tr></thead><tbody>';
  RUTINA.alertas.slice().sort((a,b)=>{
    const orden = {alta:0,media:1,baja:2};
    return orden[a.urgencia]-orden[b.urgencia];
  }).forEach(a=>{
    html += '<tr class="urgencia-'+a.urgencia+'"><td>'+a.señal+'</td><td>'+a.accion+'</td></tr>';
  });
  html += '</tbody></table>';

  html += '<h2 style="margin-top:20px;">Pendiente médico</h2>';
  RUTINA.pendienteMedico.forEach(p=>{
    html += '<div class="card">';
    html += '<h3>'+p.tema+'</h3>';
    html += '<p class="text-dim">'+p.quien+(p.prioridad?' · prioridad '+p.prioridad:'')+'</p>';
    html += '</div>';
  });

  document.getElementById('app').innerHTML = html;
}

/* ======================= ROUTER ======================= */
function router(){
  const hash = location.hash.replace(/^#/,'') || '/';
  const parts = hash.split('/').filter(Boolean);
  document.getElementById('modal-video').classList.add('hidden');

  if(parts.length===0){ renderInicio(); return; }
  if(parts[0]==='sesion' && parts[1]){ renderSesion(parts[1]); setTimeout(inicializarIndicadores,0); return; }
  if(parts[0]==='estiramiento' && parts[1]){ location.hash = '#/sesion/'+parts[1]; return; }
  if(parts[0]==='dinamico' && parts[1]){ renderBloqueDinamico(parts[1]); return; }
  if(parts[0]==='postura'){ renderPosturaSesion(); return; }
  if(parts[0]==='historial' && parts[1]){ renderHistorialDetalle(parts[1]); return; }
  if(parts[0]==='historial'){ renderHistorial(); return; }
  if(parts[0]==='ajustes'){ renderAjustes(); return; }
  if(parts[0]==='referencia'){ renderReferencia(); return; }
  renderInicio();
}
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', function(){
  router();
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
});
</script>
